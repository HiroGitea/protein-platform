[project]
name = "protein-platform-backend"
version = "0.1.0"
description = "生物信息学平台后端：把 GenMol / DiffDock / MMseqs2 / 结构预测真正跑在本地 GPU 上"
requires-python = ">=3.11"

# 核心依赖只有 Web 层，保持轻量：没有 GPU 依赖也能启动服务
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]

# 重型依赖按引擎分组，用到哪个装哪个：uv sync --group genmol
[dependency-groups]
genmol = [
    # torch 2.7+ 才有 Blackwell(sm_120) kernel，5070 Ti 必须 >=2.7，
    # 上游 genmol 仓库写死的 torch==2.6.0 在这张卡上跑不了
    "torch>=2.7",
    "transformers>=4.52",
    "lightning>=2.5",
    "safe-mol>=0.1.14",
    "bionemo-moco>=0.0.2.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "einops>=0.8",
    "jaxtyping>=0.2.34",
    "datasets>=3.0",
    "rdkit>=2024.9.1",
    "datamol>=0.12",
    "numpy>=1.26",
]
diffdock = [
    "torch>=2.7",
    "torch-geometric>=2.6",
    "rdkit>=2024.9.1",
    "biopython>=1.84",
    "e3nn>=0.5.5",
    "scipy>=1.14",
    "networkx>=3.4",
]
fold = [
    # ESMFold 走 transformers 的 EsmForProteinFolding，不需要 fair-esm
    "torch>=2.7",
    "transformers>=4.52",
    "accelerate>=1.2",
    "biopython>=1.84",
]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# FastAPI 的 Depends/File/Query 就是要写在默认参数里
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
